name: Training Pipeline

on:
  schedule:
    - cron: '0 3 * * *'  # Runs daily at 3:00 AM UTC
  workflow_dispatch:      # Allows manual trigger

jobs:
  run-training:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Training Pipeline
        env:
          AQICN_API_TOKEN: ${{ secrets.AQICN_API_TOKEN }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
          CITY_NAME: ${{ secrets.CITY_NAME }}
          CITY_LAT: ${{ secrets.CITY_LAT }}
          CITY_LON: ${{ secrets.CITY_LON }}
        # Can append --skip-lstm here if LSTM is too slow for daily automated runs
        run: |
          python -m src.training.run_training_pipeline
